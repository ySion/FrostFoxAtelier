[package]
name = "atelier_layout_probe_taffy"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# Cargo.toml lives three levels below this independent worktree's root.
# Use the locally pinned 77f385... Taffy 0.14 source, never a registry substitute.
taffy = { path = "../../../out/review/ui-layout-validation/vendor/taffy", default-features = false, features = ["std", "taffy_tree", "flexbox", "grid"] }

[profile.dev]
panic = "unwind"

[profile.release]
panic = "unwind"

# Keep this experimental package independent of any ancestor workspace.
[workspace]
